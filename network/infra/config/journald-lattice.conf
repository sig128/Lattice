# Bound journal disk use: all Lattice services (including the validator,
# started with --log) write to journald instead of the ledger directory.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=4G
SystemKeepFree=20G
SystemMaxFileSize=256M
MaxRetentionSec=21day
RateLimitIntervalSec=30s
RateLimitBurst=20000
