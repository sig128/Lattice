# Agave validator kernel tuning. Values from docs.anza.xyz "Setup an Agave
# Validator" (System Tuning > Linux) and checked against the pinned v4.3.0
# source: core/src/system_monitor_service.rs recommends rmem_max/wmem_max
# 134217728 and vm.max_map_count 1000000; core/src/resource_limits.rs raises
# RLIMIT_NOFILE to 1000000, which requires fs.nr_open >= 1000000. Never go
# below the kernel default 1048576: packaged units (caddy) ask for that much.
net.core.rmem_default = 134217728
net.core.rmem_max = 134217728
net.core.wmem_default = 134217728
net.core.wmem_max = 134217728
vm.max_map_count = 1000000
fs.nr_open = 1048576
